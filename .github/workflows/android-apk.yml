name: Build And Publish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: Latest APK
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Download the APK file from this release and install it on Android.

            Notes:
            - This is a debug APK intended for personal testing.
            - On Android, you may need to enable installation from unknown sources.
            - If prompted, grant media permissions to show local videos.
